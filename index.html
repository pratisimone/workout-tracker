<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Workout Tracker</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main id="app"></main>

  <nav id="bottom-nav">
    <button data-route="/home">
      <span class="nav-icon">🏠</span>
      <span class="nav-text">Home</span>
    </button>
    <button data-route="/history">
      <span class="nav-icon">📊</span>
      <span class="nav-text">Storico</span>
    </button>
    <button data-route="/progress">
      <span class="nav-icon">📈</span>
      <span class="nav-text">Progressi</span>
    </button>
    <button data-route="/settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-text">Impostazioni</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
